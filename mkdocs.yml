site_name: DocFinder
site_description: Local-first semantic search for your documents
site_url: https://filippostanghellini.github.io/DocFinder/
repo_url: https://github.com/filippostanghellini/DocFinder
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/logo.png
  favicon: assets/logo.png
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    # dark first = dark is the default; the toggle switches and persists
    - scheme: slate
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - search.suggest
    - search.highlight
    - content.code.copy

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/filippostanghellini/DocFinder

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: [., docs]
      check_paths: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - assets/extra.css

extra_javascript:
  - assets/landing.js

plugins:
  - search

nav:
  - DocFinder: index.md
  - Installation: install.md
  - Supported Formats: formats.md
  - Docs:
      - Overview & Usage: usage.md
      - Semantic & Hybrid Search: search.md
      - Local AI Chat (RAG): chat.md
      - Architecture: architecture.md
      - Changelog: changelog.md
      - License: license.md

copyright: Copyright &copy; 2024-2026 DocFinder Team
